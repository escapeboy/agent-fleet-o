# Warm-build egress allowlist proxy.
#
# The warm-build sandbox runs on an `internal: true` docker network with NO
# route to the internet, link-local metadata, host-gateway, or the control
# plane. Its ONLY egress is a CONNECT/GET to this proxy, which forwards ONLY to
# the domains a repo build legitimately needs — everything else is denied.
#
# Default policy is DENY; add domains here (and only here) to widen the surface.

http_port 3128

# --- allowlist (dstdomain matches the CONNECT/GET target host) ---------------
acl allowed_domains dstdomain "/etc/squid/allowlist.txt"
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

# Only HTTPS (and 80 for a few registries that redirect) to allowlisted hosts.
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed_domains
http_access deny all

# No caching (build artifacts are large and we don't want a shared cache surface).
cache deny all

# Do not leak the proxy's own identity / client details downstream.
via off
forwarded_for delete
httpd_suppress_version_string on

# Log to squid's own log dir (writable by the proxy user); the container image
# tails it to stdout for auditing which hosts a build reached.
access_log stdio:/var/log/squid/access.log squid
cache_log /dev/null

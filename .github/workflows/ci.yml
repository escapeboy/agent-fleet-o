name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Job containers default to sh; the steps rely on bash (brace expansion). Same shell the host jobs use.
defaults:
  run:
    shell: bash -e {0}

jobs:
  # ─────────────────────────────────────────
  # Job 1: Code Quality (fast, no DB needed)
  # ─────────────────────────────────────────
  quality:
    # Pull requests from forks never run on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Code Quality
    runs-on: [self-hosted, ci]
    container: shivammathur/node:2404@sha256:e701c38cc9f7168fa46c70c7dcce292249cbf6fd5a15b742b418918fd4306838

    steps:
      - uses: actions/checkout@v4

      # PHP comes from setup-php inside the job container, never from the host.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, pgsql, pdo_pgsql, redis, bcmath, pcntl, zip, gd, sockets, exif, gmp
          coverage: pcov
          tools: composer:v2

      - name: Verify PHP 8.4
        run: |
          php -v
          php -r 'if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION !== 4) { echo "Expected PHP 8.4, got " . PHP_VERSION . "\n"; exit(1); }'
          composer --version

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Laravel Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2G

      # Steps in the container run as root; hand the checkout back to the runner user (uid 1000).
      - name: Hand the workspace back
        if: always()
        run: chown -R 1000:1000 "$GITHUB_WORKSPACE"

  # ─────────────────────────────────────────
  # Job 2: Test Suite (SQLite in-memory)
  # ─────────────────────────────────────────
  tests:
    # Pull requests from forks never run on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Tests
    runs-on: [self-hosted, ci]
    container: shivammathur/node:2404@sha256:e701c38cc9f7168fa46c70c7dcce292249cbf6fd5a15b742b418918fd4306838
    needs: quality

    # Redis for the tests lives on the job network (host `redis`); nothing is published on the host.
    services:
      redis:
        image: redis:7-alpine

    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # ext-intl is not installed; force English locale formatting in Cashier.
      CASHIER_CURRENCY_LOCALE: en
      # Webclaw container only exists in docker-compose; tests must not call it.
      WEBCLAW_URL: http://127.0.0.1:65535

    steps:
      - uses: actions/checkout@v4

      # PHP comes from setup-php inside the job container, never from the host.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, pgsql, pdo_pgsql, redis, bcmath, pcntl, zip, gd, sockets, exif, gmp
          coverage: pcov
          tools: composer:v2

      - name: Verify PHP 8.4
        run: |
          php -v
          php -r 'if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION !== 4) { echo "Expected PHP 8.4, got " . PHP_VERSION . "\n"; exit(1); }'
          php -m | grep -E '(sqlite3|pcov|pgsql|redis)'

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build frontend assets (vite manifest needed for layout @vite)
        run: npm ci && npm run build

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
          mkdir -p storage/framework/{cache,sessions,views} storage/logs
          # Self-hosted runner shares storage/framework between runs — purge stale compiled views
          # so a Blade component edit from one run doesn't leak into the next.
          rm -f storage/framework/views/*.php
          php artisan view:clear

      - name: Run tests
        run: vendor/bin/phpunit

      # Steps in the container run as root; hand the checkout back to the runner user (uid 1000).
      - name: Hand the workspace back
        if: always()
        run: chown -R 1000:1000 "$GITHUB_WORKSPACE"

  # ─────────────────────────────────────────
  # Job 3: Frontend Build Verification
  # ─────────────────────────────────────────
  build:
    # Pull requests from forks never run on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Build Assets
    runs-on: [self-hosted, ci]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install & Build
        run: npm ci && npm run build
